        <div class="pregunta-card">
            <p class="pregunta">¿Qué indica un semáforo con una luz amarilla intermitente?</p>
            
            <div class="opciones">
                <button class="btn-opcion">A) Detenerse obligatoriamente en las mismas condiciones que si fuera roja.</button>

        </div>
